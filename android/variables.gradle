ext {
    /*
     * 26, e não o 24 que o Capacitor traz por padrão.
     *
     * O serviço em primeiro plano do Treino Ativo usa `NotificationChannel` e
     * `startForegroundService`, ambos da API 26. Manter 24 exigiria um caminho
     * alternativo sem notificação persistente para aparelhos de 2016 — e o
     * Android 7 está abaixo de 1% do mercado. O Gradle recusou a combinação, o
     * que é melhor que descobrir no aparelho de alguém.
     */
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}